apiVersion: apps/v1
kind: Deployment
metadata:
  name: railsync
  labels:
    app: railsync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: railsync
  template:
    metadata:
      name: railsync
      labels:
        app: railsync
    spec:
      containers:

        # Analyze data from event hub
        - name: analyzer
          image: analyzer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 82
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

        # Read IoT event hub data and write to db
        - name: consumer
          image: consumer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 81
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

        # Website for statistics and controller
        - name: website
          image: website:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

        # Prometheus instance
        - name: prometheus
          image: prom/prometheus:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9090

      restartPolicy: Always