apiVersion: apps/v1
kind: Deployment
metadata:
  name: railsync
  labels:
    app: railsync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: railsync
  template:
    metadata:
      name: railsync
      labels:
        app: railsync
    spec:
      containers:
        - name: analyzer
          image: analyzer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 82
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
        - name: consumer
          image: consumer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 81
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
        - name: website
          image: website:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      restartPolicy: Always